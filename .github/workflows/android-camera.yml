name: Android camera app

on:
  push:
    paths:
      - "android-camera/**"
      - ".github/workflows/android-camera.yml"
  pull_request:
    paths:
      - "android-camera/**"
      - ".github/workflows/android-camera.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-camera
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests, lint and debug APK
        run: ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: BlackCam-debug-apk
          path: android-camera/app/build/outputs/apk/debug/*.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports
          path: |
            android-camera/app/build/reports/
            android-camera/app/build/test-results/
